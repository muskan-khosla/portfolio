<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muskan Khosla is a Frontend Developer specializing in WordPress, Elementor, HubSpot CMS, WooCommerce, HTML, CSS, JavaScript, and responsive website development.">
    <title>Muskan Khosla | Frontend Developer | WordPress & HubSpot CMS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/variables.css">
</head>
<body>

<!-- ================================
     HEADER / NAVIGATION
================================= -->

<!-- Skip link for keyboard accessibility -->
<a href="#main-content" class="skip-link">
    Skip to content
</a>

<header class="site-header" id="site-header">

    <div class="container header-container">

        <!-- Logo -->
        <a href="#home" class="brand" aria-label="Muskan Khosla - Home">

            <span class="brand-logo" aria-hidden="true">
                MK
            </span>

            <span class="brand-name">
                Muskan Khosla
            </span>

        </a>


        <!-- Desktop Navigation -->
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">

            <ul class="nav-list">

                <li class="nav-item">
                    <a href="#home" class="nav-link active">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#about" class="nav-link">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#services" class="nav-link">
                        Services
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#portfolio" class="nav-link">
                        Portfolio
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#testimonials" class="nav-link">
                        Testimonials
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#contact" class="nav-link">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>


        <!-- Header CTA -->
        <a href="#contact" class="header-cta">
            <span>Let's Work Together</span>

            <svg
                class="header-cta-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
            >
                <path
                    d="M5 12H19"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
                <path
                    d="M12 5L19 12L12 19"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </a>


        <!-- Mobile Menu Button -->
        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-controls="main-nav"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </div>

</header>


<script src="js/main.js"></script>
</body>
</html>
